                    body: JSON.stringify({ username: username, code: code })

                wheel.style.transform = 'rotate(0deg)';

                    showResultModal(username, prizeName);
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-bolt"></i> 立即抽取彩金';

        let currentActiveId = activitiesData[0].id;

        function renderNavigation() {
            const navContainer = document.getElementById('nav-container');
            navContainer.innerHTML = '';

            activitiesData.forEach(activity => {
                const isActive = activity.id === currentActiveId;
                
                const btn = document.createElement('button');
                btn.className = `flex items-center justify-center md:justify-start gap-2 md:gap-3 px-4 py-2.5 md:px-4 md:py-3 rounded-xl transition-all duration-300 text-left flex-shrink-0 md:w-full ${
                    isActive 
                    ? 'bg-amber-500/10 text-amber-400 border border-amber-500/30 shadow-lg shadow-amber-500/5' 
                    : 'bg-slate-800/50 md:bg-transparent hover:bg-slate-800 text-slate-400 hover:text-slate-200 border border-transparent'
                }`;
                
                btn.onclick = () => {
                    currentActiveId = activity.id;
                    renderNavigation();
                    renderContent();
                    if (window.innerWidth < 768) {
                        document.getElementById('main-content').scrollTop = 0;
                        btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    }
                };

                btn.innerHTML = `
                    <div class="flex items-center justify-center ${isActive ? 'text-amber-400' : 'text-slate-500'}">
                        <i class="fa-solid ${activity.icon}"></i>
                    </div>
                    <span class="font-medium text-sm md:text-base whitespace-nowrap md:whitespace-normal md:truncate">${activity.title}</span>
                    <i class="fa-solid fa-chevron-right text-xs ml-auto hidden md:block ${isActive ? 'opacity-100' : 'opacity-0'}"></i>
                `;
                
                navContainer.appendChild(btn);
            });
        }

        function copyToClipboard(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                const originalHtml = btn.innerHTML;
                btn.innerHTML = `<i class="fa-solid fa-check text-emerald-400 text-sm"></i>`;
                btn.classList.add("text-emerald-400");
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                    btn.classList.remove("text-emerald-400");
                }, 2000);
            }).catch(err => {
                alert('复制失败，请手动选择文字复制');
            });
        }
